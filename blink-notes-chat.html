<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blink Notes Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fb; --panel:#ffffff; --side:#eef0f7; --ink:#162036; --muted:#6a7389;
  --line:#dfe3ee; --accent:#2f4bff; --accent-ink:#ffffff; --user:#2f4bff; --user-ink:#fff;
  --bot:#ffffff; --danger:#d23b4b; --ok:#16875a;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1220; --panel:#151a2c; --side:#10152a; --ink:#e8ecf8; --muted:#8b94b0;
    --line:#252c47; --accent:#6f86ff; --accent-ink:#0e1220; --user:#3a52f0; --user-ink:#fff;
    --bot:#1a2038; --danger:#ff6b7b; --ok:#4cd39a;
  }
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Hanken Grotesk",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;height:100dvh}

/* sidebar */
.side{width:280px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:18px 16px 10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.new{margin:8px 12px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600;text-align:left}
.new:hover{border-color:var(--accent)}
.list{flex:1;overflow-y:auto;padding:6px 8px}
.item{display:flex;align-items:center;gap:4px;border-radius:9px;padding:2px 2px 2px 10px}
.item:hover,.item.active{background:var(--panel)}
.item .t{flex:1;background:none;border:0;text-align:left;padding:8px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.item.active .t{font-weight:600}
.item .del{background:none;border:0;color:var(--muted);padding:6px 8px;border-radius:7px;font-size:15px;opacity:0}
.item:hover .del,.item.active .del,.item .del:focus-visible{opacity:1}
.item .del:hover{color:var(--danger)}
.empty-list{padding:14px 10px;color:var(--muted);font-size:13.5px}
.side-foot{padding:10px 12px;border-top:1px solid var(--line)}
.clear{width:100%;padding:9px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--danger);font-weight:600;font-size:13.5px}
.clear:hover{background:var(--panel)}

/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.menu{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.top h1{font-size:15px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .del-chat{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--danger);font-size:13.5px}

.feed{flex:1;overflow-y:auto;padding:22px 16px 10px;scroll-behavior:smooth}
.col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;flex-direction:column;max-width:88%}
.msg.user{align-self:flex-end;align-items:flex-end}
.bubble{padding:11px 15px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.user .bubble{background:var(--user);color:var(--user-ink);border-bottom-right-radius:5px}
.bot .bubble{background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:5px}
.meta{font-size:12px;color:var(--muted);margin:4px 6px 0}
.bubble a.dl{display:inline-block;margin:8px 8px 0 0;padding:8px 14px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none}
.bubble a.dl:hover{filter:brightness(1.08)}
.bubble.warn{border-color:var(--danger)}
.bubble.good{border-color:var(--ok)}
.progress{display:flex;align-items:center;gap:10px}
.bar{width:120px;height:6px;border-radius:6px;background:var(--line);overflow:hidden;position:relative}
.bar::after{content:"";position:absolute;inset:0;width:40%;background:var(--accent);border-radius:6px;animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){.bar::after{animation:none;width:100%;opacity:.5}}

.welcome{text-align:center;margin:8vh auto 0;max-width:560px}
.welcome h2{font-size:26px;letter-spacing:-.02em;margin-bottom:8px}
.welcome p{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:13.5px}
.chip:hover{border-color:var(--accent);color:var(--accent)}

/* composer */
.composer{padding:8px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.opts{max-width:760px;margin:0 auto 8px;display:flex;gap:6px;flex-wrap:wrap}
.opts select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;max-width:100%}
.box{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px}
.box:focus-within{border-color:var(--accent)}
.box textarea{flex:1;border:0;background:transparent;resize:none;outline:none;max-height:140px;padding:6px 0;line-height:1.45}
.send{border:0;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:9px 16px}
.send:disabled{opacity:.45;cursor:not-allowed}
.hint{max-width:760px;margin:6px auto 0;text-align:center;font-size:12px;color:var(--muted)}

/* mobile */
.scrim{display:none}
@media (max-width:820px){
  .side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s;width:min(300px,86vw)}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}
  .menu{display:block}
  .msg{max-width:94%}
  .item .del{opacity:1}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Chat history">
    <div class="brand">Blink Notes<small>Study notes for JEE and NEET</small></div>
    <button class="new" id="newChat">+ New chat</button>
    <div class="list" id="list"></div>
    <div class="side-foot"><button class="clear" id="clearAll">Delete all chats</button></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="top">
      <button class="menu" id="menu" aria-label="Open chat history">☰</button>
      <h1 id="title">New chat</h1>
      <button class="del-chat" id="delChat">Delete chat</button>
    </header>

    <div class="feed" id="feed"><div class="col" id="col"></div></div>

    <div class="composer">
      <div class="opts" id="opts">
        <select id="o_style" aria-label="Style">
          <option>Handwritten</option><option>Normal</option><option>Colourful</option>
        </select>
        <select id="o_lang" aria-label="Language">
          <option>English</option><option>Hindi</option><option>Bengali</option><option>Hinglish</option>
        </select>
        <select id="o_scope" aria-label="Length">
          <option value="topic">Short (2–4 pages)</option><option value="chapter">Full chapter</option>
        </select>
        <select id="o_level" aria-label="Exam level">
          <option>JEE Main + Advanced</option><option>JEE Main</option><option>JEE Advanced</option><option>NEET</option>
        </select>
        <select id="o_fmt" aria-label="Format">
          <option>PDF</option><option>PNG</option><option>JPG</option>
        </select>
      </div>
      <div class="box">
        <textarea id="input" rows="1" placeholder="Type a chapter or topic, e.g. Class 12 Physics Alternating Current"></textarea>
        <button class="send" id="send">Send</button>
      </div>
      <div class="hint">Only study questions are accepted. Enter to send, Shift+Enter for a new line.</div>
    </div>
  </main>
</div>

<script>
/* ===== Settings: change these when you move to your real website ===== */
const BASE = "https://blinkstudynotes.app.n8n.cloud/webhook/study-notes";
const POLL_MS = 10000;          // status check every 10 s
const MAX_WAIT_MS = 30 * 60e3;  // stop waiting after 30 min
const STORE_KEY = "blink_notes_chats_v1";

/* ===== Storage (falls back to memory if the browser blocks localStorage) ===== */
let mem = null;
const store = {
  load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }catch(e){ return mem || []; } },
  save(d){ mem = d; try{ localStorage.setItem(STORE_KEY, JSON.stringify(d)); }catch(e){} }
};
let chats = store.load();
let currentId = chats.length ? chats[0].id : null;
const pollers = {}; // job polling timers by chat id

/* ===== Study-only filter ===== */
const SUBJECTS = {
  Physics: /physics|mechanics|optics|thermodynamics|electro\w*|magnet\w*|alternating|current|wave|oscillation|kinematics|newton|gravitation|semiconductor|nuclei|nuclear|capacitor|inductance|transformer|ray|lens|rotational|fluid|ac\b|dc\b/i,
  Chemistry: /chemistry|organic|inorganic|physical chem|mole|atom|bond|periodic|equilibrium|electrochem|kinetics|hydrocarbon|alcohol|polymer|coordination|redox|titration|thermochem/i,
  Mathematics: /math|maths|calculus|algebra|trigonometry|matrices|determinant|vector|probability|conic|integral|derivative|limit|permutation|combination|sequence|complex number|binomial/i,
  Biology: /biology|botany|zoology|cell|genetic|dna|rna|photosynthesis|respiration|human physiology|ecology|evolution|reproduction|plant|enzyme|biotechnology|neural/i
};
const STUDY_WORDS = /\b(notes?|chapter|topic|syllabus|formula|derivation|concept|theory|class\s?(9|10|11|12|xi|xii)|jee|neet|board|wb board|cbse|ncert|exam|mcq|numerical|revision|study|explain|chapter-wise)\b/i;
const GREET = /^(hi|hello|hey|hii|namaste|good (morning|evening|afternoon))\b[\s!.?]*$/i;

function classify(text){
  const t = text.trim();
  if(GREET.test(t)) return {kind:"greet"};
  let subject = null;
  for(const [name,rx] of Object.entries(SUBJECTS)) if(rx.test(t)){ subject = name; break; }
  const study = !!subject || STUDY_WORDS.test(t);
  return {kind: study ? "study" : "reject", subject};
}

/* ===== Helpers ===== */
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const now = () => new Date().toISOString();
const fmtTime = iso => new Date(iso).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cur = () => chats.find(c => c.id === currentId);
const persist = () => store.save(chats);

function newChat(){
  const c = {id: uid(), title: "New chat", created: now(), messages: []};
  chats.unshift(c); currentId = c.id; persist(); render(); closeSide();
  $("input").focus();
}
function deleteChat(id){
  const c = chats.find(x => x.id === id); if(!c) return;
  if(!confirm(`Delete "${c.title}"? This cannot be undone.`)) return;
  clearInterval(pollers[id]); delete pollers[id];
  chats = chats.filter(x => x.id !== id);
  if(currentId === id) currentId = chats.length ? chats[0].id : null;
  persist(); render();
}
function deleteAll(){
  if(!chats.length) return;
  if(!confirm("Delete all chats? This cannot be undone.")) return;
  Object.values(pollers).forEach(clearInterval);
  chats = []; currentId = null; persist(); render();
}
function addMsg(chat, role, html, extra={}){
  const m = {id: uid(), role, html, time: now(), ...extra};
  chat.messages.push(m); persist();
  if(chat.id === currentId) render(true);
  return m;
}

/* ===== Rendering ===== */
function renderList(){
  const el = $("list");
  if(!chats.length){ el.innerHTML = '<div class="empty-list">No chats yet. Your history will appear here.</div>'; return; }
  el.innerHTML = chats.map(c => `
    <div class="item ${c.id===currentId?"active":""}">
      <button class="t" data-open="${c.id}" title="${esc(c.title)}">${esc(c.title)}</button>
      <button class="del" data-del="${c.id}" aria-label="Delete chat ${esc(c.title)}">✕</button>
    </div>`).join("");
}
function renderFeed(keepScroll){
  const col = $("col"), c = cur();
  if(!c || !c.messages.length){
    col.innerHTML = `
      <div class="welcome">
        <h2>What do you want to study today?</h2>
        <p>Name a chapter or topic and I'll make detailed JEE and NEET notes. Pick style, language and format below.</p>
        <div class="chips">
          <button class="chip">Class 12 Physics Alternating Current</button>
          <button class="chip">Chemistry Chemical Equilibrium</button>
          <button class="chip">Maths Definite Integrals</button>
          <button class="chip">Biology Photosynthesis NEET</button>
        </div>
      </div>`;
    return;
  }
  col.innerHTML = c.messages.map(m => `
    <div class="msg ${m.role}">
      <div class="bubble ${m.cls||""}">${m.html}</div>
      <div class="meta">${fmtTime(m.time)}</div>
    </div>`).join("");
  const feed = $("feed");
  feed.scrollTop = feed.scrollHeight;
}
function render(keep){
  renderList(); renderFeed(keep);
  $("title").textContent = cur() ? cur().title : "New chat";
  $("delChat").style.visibility = cur() ? "visible" : "hidden";
}

/* ===== Sending ===== */
async function send(){
  const input = $("input");
  const text = input.value.trim();
  if(!text) return;
  if(!cur()) newChat();
  const chat = cur();
  input.value = ""; autosize();

  if(chat.title === "New chat"){ chat.title = text.slice(0,48); }
  addMsg(chat, "user", esc(text));

  const verdict = classify(text);
  if(verdict.kind === "greet"){
    addMsg(chat, "bot", "Hi! Tell me a chapter or topic, for example <b>Class 12 Physics Alternating Current</b>, and I'll prepare the notes.");
    return;
  }
  if(verdict.kind === "reject"){
    addMsg(chat, "bot", "I can only help with study topics for JEE, NEET and board exams. Try a chapter or topic name, like <b>Chemistry Chemical Equilibrium</b>.", {cls:"warn"});
    return;
  }

  const payload = {
    topic: text,
    subject: verdict.subject || "General",
    scope: $("o_scope").value,
    exam_level: $("o_level").value,
    language: $("o_lang").value,
    style: $("o_style").value,
    diagrams: "Where needed",
    output_format: $("o_fmt").value
  };

  const wait = addMsg(chat, "bot",
    `<div class="progress"><div class="bar"></div><span>Starting your ${payload.scope==="chapter"?"full chapter":"short"} notes…</span></div>`);
  try{
    const r = await fetch(BASE + "/start", {
      method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)
    });
    if(!r.ok) throw new Error("Server replied " + r.status);
    const { job_id } = await r.json();
    if(!job_id) throw new Error("No job id returned");
    wait.html = `<div class="progress"><div class="bar"></div><span>Writing your notes. ${payload.scope==="chapter"?"A full chapter can take several minutes.":"This usually takes a few minutes."} You can open another chat meanwhile.</span></div>`;
    persist(); if(chat.id===currentId) render(true);
    poll(chat.id, wait.id, job_id);
  }catch(err){
    fail(chat.id, wait.id, err);
  }
}

function poll(chatId, msgId, jobId){
  const started = Date.now();
  pollers[chatId] = setInterval(async () => {
    const chat = chats.find(c => c.id === chatId);
    if(!chat){ clearInterval(pollers[chatId]); return; }
    try{
      if(Date.now() - started > MAX_WAIT_MS) throw new Error("Timed out after 30 minutes");
      const r = await fetch(BASE + "/status?job_id=" + encodeURIComponent(jobId));
      if(!r.ok) throw new Error("Status check failed (" + r.status + ")");
      const s = await r.json();
      if(s.status === "done"){
        clearInterval(pollers[chatId]); delete pollers[chatId];
        const links = String(s.links||"").split("\n").map(x=>x.trim()).filter(Boolean);
        const buttons = links.map((u,i) =>
          `<a class="dl" href="${esc(u)}" target="_blank" rel="noopener">Download${links.length>1?" "+(i+1):""}</a>`).join("");
        setMsg(chat, msgId, `Your notes are ready${s.pages?` (${esc(String(s.pages))} pages)`:""}. Links work for 24 hours.<br>${buttons}`, "good");
      } else if(s.status === "error" || s.status === "failed"){
        throw new Error(s.error || "The workflow reported an error");
      }
    }catch(err){
      clearInterval(pollers[chatId]); delete pollers[chatId];
      fail(chatId, msgId, err);
    }
  }, POLL_MS);
}
function setMsg(chat, msgId, html, cls){
  const m = chat.messages.find(x => x.id === msgId); if(!m) return;
  m.html = html; m.cls = cls || ""; persist();
  if(chat.id === currentId) render(true);
}
function fail(chatId, msgId, err){
  const chat = chats.find(c => c.id === chatId); if(!chat) return;
  const cors = (err instanceof TypeError) ? "<br>The browser blocked the request. In n8n, open the webhook nodes and set Allowed Origins (CORS) to * or your site address." : "";
  setMsg(chat, msgId, `Could not finish the notes: ${esc(err.message)}.${cors}<br>Check that the workflow is published, then send the topic again.`, "warn");
}

/* ===== UI wiring ===== */
function autosize(){ const t=$("input"); t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,140)+"px"; }
function openSide(){ $("side").classList.add("open"); $("scrim").classList.add("show"); }
function closeSide(){ $("side").classList.remove("open"); $("scrim").classList.remove("show"); }

$("send").onclick = send;
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); } });
$("newChat").onclick = newChat;
$("clearAll").onclick = deleteAll;
$("delChat").onclick = () => cur() && deleteChat(cur().id);
$("menu").onclick = openSide;
$("scrim").onclick = closeSide;
$("list").addEventListener("click", e => {
  const del = e.target.closest("[data-del]"); if(del){ deleteChat(del.dataset.del); return; }
  const open = e.target.closest("[data-open]"); if(open){ currentId = open.dataset.open; render(); closeSide(); }
});
$("col").addEventListener("click", e => {
  const chip = e.target.closest(".chip"); if(chip){ $("input").value = chip.textContent; $("input").focus(); autosize(); }
});

render();
</script>
</body>
</html>
